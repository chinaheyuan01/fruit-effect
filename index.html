<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍎 水果单词乐园 - 抖音特效版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; user-select: none; }
  
  #app {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    overflow: hidden;
  }
  
  #stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 100%;
    max-height: 900px;
    background: linear-gradient(180deg, #ff9a9e 0%, #fad0c4 30%, #a1c4fd 70%, #c2e9fb 100%);
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }
  
  /* Animated background */
  .bg-shapes {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }
  
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    animation: float 8s ease-in-out infinite;
  }
  
  .shape:nth-child(1) { width: 120px; height: 120px; background: #FFD93D; top: 10%; left: -30px; animation-delay: 0s; }
  .shape:nth-child(2) { width: 80px; height: 80px; background: #FF6B6B; top: 30%; right: -20px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 150px; height: 150px; background: #4ECDC4; bottom: 20%; left: -40px; animation-delay: 4s; }
  .shape:nth-child(4) { width: 60px; height: 60px; background: #A78BFA; top: 60%; right: -10px; animation-delay: 1s; }
  .shape:nth-child(5) { width: 100px; height: 100px; background: #F472B6; bottom: 10%; right: 20%; animation-delay: 3s; }
  
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(10deg); }
  }
  
  /* Particle canvas */
  #particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
  }
  
  /* Top HUD */
  .hud-top {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
  }
  
  .score-badge {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    animation: pulse 2s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  
  .score-badge .icon { font-size: 20px; }
  .score-badge .value { font-size: 18px; font-weight: bold; color: #333; }
  
  .streak-badge {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    border-radius: 25px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(238, 90, 36, 0.4);
    transition: transform 0.3s;
  }
  
  .streak-badge.active {
    animation: streakGlow 0.5s ease-in-out;
  }
  
  @keyframes streakGlow {
    0% { transform: scale(1); box-shadow: 0 4px 20px rgba(238, 90, 36, 0.4); }
    50% { transform: scale(1.2); box-shadow: 0 4px 40px rgba(255, 107, 107, 0.8); }
    100% { transform: scale(1); box-shadow: 0 4px 20px rgba(238, 90, 36, 0.4); }
  }
  
  .streak-badge .icon { font-size: 20px; }
  .streak-badge .value { font-size: 18px; font-weight: bold; color: white; }
  
  /* Progress bar */
  .progress-container {
    position: absolute;
    top: 65px;
    left: 20px;
    right: 20px;
    height: 6px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    overflow: hidden;
    z-index: 50;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    background-size: 300% 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
    animation: gradientSlide 3s linear infinite;
  }
  
  @keyframes gradientSlide {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
  }
  
  /* Game area */
  .game-area {
    position: absolute;
    top: 90px;
    left: 0;
    right: 0;
    bottom: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 30;
  }
  
  .question-text {
    font-size: 16px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 15px;
    text-align: center;
    animation: slideDown 0.5s ease;
  }
  
  @keyframes slideDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .fruit-stage {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fruitBounce 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  
  @keyframes fruitBounce {
    0% { transform: scale(0) rotate(-180deg); }
    60% { transform: scale(1.1) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  
  .fruit-glow {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.6;
    animation: glowPulse 2s ease-in-out infinite;
  }
  
  @keyframes glowPulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }
  
  .fruit-image {
    width: 200px;
    height: 200px;
    object-fit: contain;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
    animation: fruitSpin 10s linear infinite;
  }
  
  @keyframes fruitSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  .fruit-emoji {
    font-size: 140px;
    text-align: center;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
    animation: fruitBob 2s ease-in-out infinite;
  }
  
  @keyframes fruitBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  /* Word display for listening mode */
  .word-display {
    font-size: 48px;
    font-weight: bold;
    color: white;
    text-shadow: 0 4px 20px rgba(0,0,0,0.4);
    letter-spacing: 3px;
    margin-bottom: 10px;
    animation: wordAppear 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  
  @keyframes wordAppear {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  
  .play-sound-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    box-shadow: 0 8px 30px rgba(238, 90, 36, 0.5);
    transition: transform 0.2s;
    margin-bottom: 20px;
  }
  
  .play-sound-btn:active { transform: scale(0.9); }
  .play-sound-btn.playing { animation: soundWave 0.5s ease-in-out; }
  
  @keyframes soundWave {
    0% { box-shadow: 0 8px 30px rgba(238, 90, 36, 0.5); }
    50% { box-shadow: 0 8px 50px rgba(255, 255, 255, 0.8), 0 0 60px rgba(238, 90, 36, 0.6); }
    100% { box-shadow: 0 8px 30px rgba(238, 90, 36, 0.5); }
  }
  
  .play-sound-btn .icon { font-size: 28px; }
  
  /* Options area */
  .options-area {
    position: absolute;
    bottom: 180px;
    left: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    z-index: 40;
  }
  
  .option-btn {
    flex: 1;
    max-width: 110px;
    aspect-ratio: 1;
    background: rgba(255,255,255,0.95);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: all 0.2s ease;
    animation: optionAppear 0.5s ease backwards;
    padding: 10px;
  }
  
  .option-btn:nth-child(1) { animation-delay: 0.1s; }
  .option-btn:nth-child(2) { animation-delay: 0.2s; }
  .option-btn:nth-child(3) { animation-delay: 0.3s; }
  
  @keyframes optionAppear {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .option-btn:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.25); }
  .option-btn:active { transform: scale(0.95); }
  
  .option-btn.correct {
    animation: correctFlash 0.6s ease;
    background: linear-gradient(135deg, #00b894, #00cec9);
  }
  
  @keyframes correctFlash {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.1); box-shadow: 0 0 40px #00b894; }
    50% { transform: scale(0.95); }
    75% { transform: scale(1.05); }
  }
  
  .option-btn.wrong {
    animation: wrongShake 0.5s ease;
    background: linear-gradient(135deg, #d63031, #e17055);
  }
  
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }
  
  .option-btn .fruit-emoji { font-size: 36px; animation: none; }
  .option-btn .fruit-name { font-size: 13px; font-weight: bold; color: #333; }
  .option-btn .fruit-cn { font-size: 11px; color: #666; }
  
  .option-btn.mode-word .fruit-emoji { display: none; }
  .option-btn.mode-word .fruit-name { font-size: 18px; }
  .option-btn.mode-word .fruit-cn { display: none; }
  
  /* Bottom area */
  .bottom-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 160px;
    background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  
  .mode-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }
  
  .mode-btn {
    padding: 8px 14px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  
  .mode-btn.active {
    background: white;
    color: #667eea;
    border-color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  
  .mode-btn:active { transform: scale(0.95); }
  
  .action-row {
    display: flex;
    gap: 10px;
  }
  
  .action-btn {
    padding: 12px 20px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #ff6b6b, #ee5a24);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(238, 90, 36, 0.4);
    transition: all 0.2s;
  }
  
  .action-btn:active { transform: scale(0.95); }
  
  .action-btn.secondary {
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    box-shadow: none;
  }
  
  /* Feedback overlay */
  .feedback-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 200;
  }
  
  .feedback-text {
    font-size: 60px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 30px rgba(255,255,255,0.8);
    animation: feedbackPop 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
    opacity: 0;
  }
  
  @keyframes feedbackPop {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    50% { transform: scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  
  /* Screen flash */
  .screen-flash {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 150;
  }
  
  .screen-flash.active {
    animation: flash 0.3s ease;
  }
  
  @keyframes flash {
    0% { opacity: 0; }
    50% { opacity: 0.8; }
    100% { opacity: 0; }
  }
  
  /* Rainbow effect */
  .rainbow-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(
      0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3
    );
    background-size: 100% 700%;
    opacity: 0;
    pointer-events: none;
    z-index: 90;
  }
  
  .rainbow-bg.active {
    animation: rainbowScroll 2s linear forwards;
  }
  
  @keyframes rainbowScroll {
    0% { opacity: 0; background-position: 0% 0%; }
    20% { opacity: 0.5; }
    100% { opacity: 0; background-position: 0% 100%; }
  }
  
  /* Shake effect */
  .shake {
    animation: screenShake 0.3s ease;
  }
  
  @keyframes screenShake {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-10px, 5px); }
    40% { transform: translate(10px, -5px); }
    60% { transform: translate(-8px, 3px); }
    80% { transform: translate(8px, -3px); }
  }
  
  /* Hint for spelling mode */
  .spelling-input {
    width: 100%;
    max-width: 250px;
    padding: 15px 20px;
    border: none;
    border-radius: 30px;
    background: rgba(255,255,255,0.95);
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    color: #333;
    outline: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    margin-bottom: 20px;
    letter-spacing: 3px;
  }
  
  .spelling-hint {
    font-size: 20px;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 15px;
    letter-spacing: 2px;
  }
  
  /* Learn mode card */
  .learn-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    background: rgba(255,255,255,0.95);
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    z-index: 60;
    animation: cardFlip 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  
  @keyframes cardFlip {
    0% { transform: translate(-50%, -50%) rotateY(180deg) scale(0.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) rotateY(0) scale(1); opacity: 1; }
  }
  
  .learn-card .fruit-emoji { font-size: 80px; margin-bottom: 15px; }
  .learn-card .fruit-name { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 5px; }
  .learn-card .fruit-cn { font-size: 20px; color: #666; margin-bottom: 15px; }
  .learn-card .fruit-sentence { font-size: 14px; color: #888; line-height: 1.5; font-style: italic; }
  .learn-card .navigation { display: flex; gap: 15px; margin-top: 20px; justify-content: center; }
  .learn-card .nav-btn { 
    width: 50px; height: 50px; border-radius: 50%; 
    border: none; background: #f0f0f0; cursor: pointer; font-size: 24px;
    transition: transform 0.2s;
  }
  .learn-card .nav-btn:active { transform: scale(0.9); }
  .learn-card .nav-btn.learned { background: #00b894; color: white; }
  
  /* Report modal */
  .report-modal {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .report-card {
    width: 320px;
    background: white;
    border-radius: 25px;
    padding: 30px;
    text-align: center;
    animation: cardFlip 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }
  
  .report-card h2 { font-size: 24px; color: #333; margin-bottom: 20px; }
  .report-stats { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
  .report-stat { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #f8f9fa; border-radius: 12px; }
  .report-stat .label { font-size: 14px; color: #666; }
  .report-stat .value { font-size: 20px; font-weight: bold; color: #333; }
  
  /* Hidden */
  .hidden { display: none !important; }
  
  /* Responsive */
  @media (max-width: 380px) {
    .option-btn { max-width: 95px; }
    .option-btn .fruit-emoji { font-size: 28px; }
    .fruit-stage { width: 180px; height: 180px; }
    .fruit-image { width: 160px; height: 160px; }
    .fruit-emoji { font-size: 110px; }
    .word-display { font-size: 36px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    
    <!-- Animated background shapes -->
    <div class="bg-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>
    
    <!-- Particle canvas -->
    <canvas id="particles"></canvas>
    
    <!-- Screen effects -->
    <div class="screen-flash" id="screenFlash"></div>
    <div class="rainbow-bg" id="rainbowBg"></div>
    <div class="feedback-overlay" id="feedbackOverlay">
      <div class="feedback-text" id="feedbackText"></div>
    </div>
    
    <!-- Top HUD -->
    <div class="hud-top">
      <div class="score-badge">
        <span class="icon">⭐</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <div class="streak-badge" id="streakBadge">
        <span class="icon">🔥</span>
        <span class="value" id="streakValue">0</span>
      </div>
      <div class="score-badge">
        <span class="icon">🏆</span>
        <span class="value" id="bestValue">0</span>
      </div>
    </div>
    
    <!-- Progress bar -->
    <div class="progress-container">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    
    <!-- Game area -->
    <div class="game-area" id="gameArea">
      <!-- Dynamically populated -->
    </div>
    
    <!-- Options area -->
    <div class="options-area" id="optionsArea">
      <!-- Dynamically populated -->
    </div>
    
    <!-- Bottom area -->
    <div class="bottom-area">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="picture">🎯 看图</button>
        <button class="mode-btn" data-mode="spelling">✏️ 拼写</button>
        <button class="mode-btn" data-mode="listening">🎧 听音</button>
        <button class="mode-btn" data-mode="learn">📚 学习</button>
      </div>
      <div class="action-row">
        <button class="action-btn secondary" id="reportBtn">📊 报告</button>
        <button class="action-btn" id="nextBtn">🎲 下一题</button>
      </div>
    </div>
    
    <!-- Report modal -->
    <div class="report-modal hidden" id="reportModal">
      <div class="report-card">
        <h2>📊 学习报告</h2>
        <div class="report-stats">
          <div class="report-stat"><span class="label">⭐ 总得分</span><span class="value" id="reportScore">0</span></div>
          <div class="report-stat"><span class="label">📝 答题数量</span><span class="value" id="reportTotal">0</span></div>
          <div class="report-stat"><span class="label">🔥 最高连对</span><span class="value" id="reportBest">0</span></div>
          <div class="report-stat"><span class="label">📚 已学会</span><span class="value" id="reportLearned">0/13</span></div>
        </div>
        <button class="action-btn" id="closeReport">返回游戏</button>
      </div>
    </div>
    
  </div>
</div>

<script>
// ============ Fruit Data ============
const fruits = {
  apple: { cn: "苹果", emoji: "🍎", color: "#E74C3C", sentence: "I eat an apple every day." },
  banana: { cn: "香蕉", emoji: "🍌", color: "#F1C40F", sentence: "Monkeys love bananas." },
  strawberry: { cn: "草莓", emoji: "🍓", color: "#FF6B6B", sentence: "Strawberries are sweet." },
  grape: { cn: "葡萄", emoji: "🍇", color: "#8E44AD", sentence: "Grapes make yummy juice." },

// ============ Particle System ============
const ctx = particlesCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  particlesCanvas.width = stage.offsetWidth;
  particlesCanvas.height = stage.offsetHeight;
}

function createParticles(x, y, color, count = 30) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 0.5) * 15 - 5,
      size: Math.random() * 8 + 4,
      color: color || `hsl(${Math.random() * 360}, 100%, 60%)`,
      life: 1,
      decay: Math.random() * 0.02 + 0.01,
      gravity: 0.3
    });
  }
}

function updateParticles() {
  ctx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
  
  particles = particles.filter(p => p.life > 0);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.life -= p.decay;
    
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
    
    // Glow effect
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  
  requestAnimationFrame(updateParticles);
}

// Start particle loop
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
updateParticles();

// ============ Audio (using Web Audio API for beep sounds) ============
let audioCtx = null;

function playTone(freq, duration = 0.1, type = 'sine', volume = 0.1) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playCorrectSound() {
  playTone(523.25, 0.1);
  setTimeout(() => playTone(659.25, 0.1), 100);
  setTimeout(() => playTone(783.99, 0.2), 200);
}

function playWrongSound() {
  playTone(200, 0.3, 'sawtooth', 0.05);
}

function playClickSound() {

}

// ============ Smart Fruit Selection ============
function selectFruit() {
  const minCount = Math.min(...Object.values(state.fruitCounts));
  let candidates = fruitKeys.filter(k => state.fruitCounts[k] === minCount);
  
  if (state.previousFruit && candidates.length > 1) {
    candidates = candidates.filter(k => k !== state.previousFruit);
  }
  
  if (candidates.length === 0) {
    candidates = fruitKeys.filter(k => k !== state.previousFruit);
  }
  
  const selected = candidates[Math.floor(Math.random() * candidates.length)];
  state.currentFruit = selected;
  state.fruitCounts[selected]++;
  state.previousFruit = selected;
  return selected;
}

function generateOptions(correctFruit) {
  const options = [correctFruit];
  const others = fruitKeys.filter(k => k !== correctFruit);
  
  // Shuffle others
  for (let i = others.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [others[i], others[j]] = [others[j], others[i]];
  }
  
  options.push(others[0], others[1]);
  
  // Shuffle options
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  
  state.options = options;
}

      img.style.display = 'none';
      const emoji = document.createElement('div');
      emoji.className = 'fruit-emoji';
      emoji.textContent = fruit.emoji;

    };
    
    stage.appendChild(glow);
    stage.appendChild(img);
    gameArea.appendChild(stage);
    
    // Show word options
    renderWordOptions();
    
  } else if (state.currentMode === 'spelling') {
    // Show fruit + input
    const stage = document.createElement('div');
    stage.className = 'fruit-stage';
    
    const glow = document.createElement('div');
    glow.className = 'fruit-glow';
    glow.style.background = fruit.color;
    
    const img = document.createElement('img');
    img.className = 'fruit-image';
    img.src = `${state.currentFruit}.jpg`;
    img.alt = fruit.cn;
    img.onerror = () => {
      img.style.display = 'none';
      const emoji = document.createElement('div');
      emoji.className = 'fruit-emoji';
      emoji.textContent = fruit.emoji;
      stage.appendChild(emoji);
    };
    
    stage.appendChild(glow);
    stage.appendChild(img);
    gameArea.appendChild(stage);
    
    // Spelling hint
    const wordLen = state.currentFruit.length;
    let hint;
    if (wordLen <= 3) {
      hint = `有 ${wordLen} 个字母`;
    } else {
      const half = Math.floor(wordLen / 2);
      let revealed = '';
      for (let i = 0; i < wordLen; i++) {
        revealed += i < half ? state.currentFruit[i] : '_';
      }
      hint = `${wordLen} 个字母，开头: ${revealed}`;
    }
    
    const hintEl = document.createElement('div');
    hintEl.className = 'spelling-hint';
    hintEl.textContent = `提示: ${hint}`;
    gameArea.appendChild(hintEl);
    
    // Input field
    const input = document.createElement('input');
    input.className = 'spelling-input';
    input.type = 'text';
    input.placeholder = '输入英文单词';
    input.autocomplete = 'off';
    input.setAttribute('data-fruit', state.currentFruit);
    
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        checkSpellingAnswer(input);
      }
    });
    
    gameArea.appendChild(input);
    setTimeout(() => input.focus(), 100);
    
    // Submit button
    const submitBtn = document.createElement('button');
    submitBtn.className = 'action-btn';
    submitBtn.textContent = '✓ 确定';
    submitBtn.onclick = () => checkSpellingAnswer(input);
    gameArea.appendChild(submitBtn);
    
  } else if (state.currentMode === 'listening') {
    // Show word + play button

function renderLearnMode() {
  const card = document.createElement('div');
  card.className = 'learn-card';
  
  const fruit = fruits[state.currentFruit];
  
  card.innerHTML = `
    <div class="fruit-emoji">${fruit.emoji}</div>
    <div class="fruit-name">${state.currentFruit}</div>
    <div class="fruit-cn">${fruit.cn}</div>
    <div class="fruit-sentence">${fruit.sentence}</div>
    <div class="navigation">
      <button class="nav-btn" id="prevLearn">←</button>
      <button class="nav-btn ${state.learned.has(state.currentFruit) ? 'learned' : ''}" id="toggleLearn">
        ${state.learned.has(state.currentFruit) ? '✓' : '○'}
      </button>
      <button class="nav-btn" id="nextLearn">→</button>
    </div>
  `;
  
  gameArea.appendChild(card);
  
  $('prevLearn').onclick = () => {
    const idx = fruitKeys.indexOf(state.currentFruit);
    state.currentFruit = fruitKeys[(idx - 1 + fruitKeys.length) % fruitKeys.length];
    renderQuestion();
  };
  
  $('nextLearn').onclick = () => {
    const idx = fruitKeys.indexOf(state.currentFruit);
    state.currentFruit = fruitKeys[(idx + 1) % fruitKeys.length];
    renderQuestion();
  };
  
  $('toggleLearn').onclick = () => {
    if (state.learned.has(state.currentFruit)) {
      state.learned.delete(state.currentFruit);
    } else {
      state.learned.add(state.currentFruit);
    }
    renderQuestion();
    updateHUD();
  };
}

// ============ Game Logic ============
function handleAnswer(selected, btn) {
  if (state.isAnswering || state.currentMode === 'learn') return;
  state.isAnswering = true;
  state.totalQuestions++;
  
  const correct = selected === state.currentFruit;
  
  if (correct) {
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const bonus = state.streak >= 3 ? state.streak * 2 : 0;
    const points = 10 + bonus;
    state.score += points;
    state.learned.add(state.currentFruit);
    
    showFeedback(encouragements[Math.floor(Math.random() * encouragements.length)], true);
    triggerCelebration();
    playCorrectSound();
    
    if (btn) btn.classList.add('correct');
    
    setTimeout(nextQuestion, 2000);
    
  } else {
    state.streak = 0;
    const correctFruit = fruits[state.currentFruit];
    showFeedback(`😅 正确答案是 ${state.currentFruit}`, false);
    stage.classList.add('shake');
    setTimeout(() => stage.classList.remove('shake'), 300);
    playWrongSound();
    
    if (btn) btn.classList.add('wrong');
    
    setTimeout(nextQuestion, 2500);
  }
  
  updateHUD();
}

function checkSpellingAnswer(input) {
  if (state.isAnswering) return;
  const value = input.value.trim().toLowerCase();
  if (!value) {
    input.style.animation = 'none';
    setTimeout(() => input.style.animation = '', 10);
    return;
  }
  handleAnswer(value, null);
}

function nextQuestion() {
  state.isAnswering = false;
  
  if (state.currentMode === 'learn') {
    // Stay in learn mode, just re-render
    renderQuestion();
    return;
  }
  
  selectFruit();
  
  if (state.currentMode === 'picture' || state.currentMode === 'listening') {
    generateOptions(state.currentFruit);
  }
  
  renderQuestion();
}

function showFeedback(text, isCorrect) {
  feedbackText.textContent = text;
  feedbackOverlay.style.opacity = '1';
  feedbackText.style.animation = 'none';
  void feedbackText.offsetWidth;
  feedbackText.style.animation = '';
  
  setTimeout(() => {
    feedbackOverlay.style.opacity = '0';
  }, 1500);
}

function triggerCelebration() {
  // Screen flash
  screenFlash.classList.remove('active');
  void screenFlash.offsetWidth;
  screenFlash.classList.add('active');
  setTimeout(() => screenFlash.classList.remove('active'), 300);
  
  // Rainbow for 5+ streak
  if (state.streak >= 5) {
    rainbowBg.classList.remove('active');
    void rainbowBg.offsetWidth;
    rainbowBg.classList.add('active');
    setTimeout(() => rainbowBg.classList.remove('active'), 2000);
  }
  
  // Particle explosion at center
  const rect = stage.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  
  const fruit = fruits[state.currentFruit];
  
  // Main explosion
  createParticles(cx, cy, fruit.color, 40);
  
  // Multiple colored bursts
  const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#1dd1a1', '#5f27cd'];
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const dist = 80;
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist;
    setTimeout(() => createParticles(px, py, colors[i], 20), i * 80);
  }
}

function speakWord(word) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'en-US';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }
}

// ============ HUD Update ============
function updateHUD() {
  scoreValue.textContent = state.score;
  streakValue.textContent = state.streak;
  bestValue.textContent = state.bestStreak;
  
  if (state.streak >= 3) {
    streakBadge.classList.add('active');
    setTimeout(() => streakBadge.classList.remove('active'), 500);
  }
  
  const progress = (state.learned.size / fruitKeys.length) * 100;
  progressFill.style.width = progress + '%';
}

// ============ Event Listeners ============
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    playClickSound();
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentMode = btn.dataset.mode;
    
    if (state.currentMode === 'learn') {
      state.currentFruit = fruitKeys[0];
    }
    
    selectFruit();
    if (state.currentMode === 'picture' || state.currentMode === 'listening') {
      generateOptions(state.currentFruit);
    }
    nextQuestion();
  });
});

$('nextBtn').addEventListener('click', () => {

});

$('reportBtn').addEventListener('click', () => {
  playClickSound();
  $('reportScore').textContent = state.score;
  $('reportTotal').textContent = state.totalQuestions;
  $('reportBest').textContent = state.bestStreak;
  $('reportLearned').textContent = `${state.learned.size}/13`;

$('closeReport').addEventListener('click', () => {
  playClickSound();
  reportModal.classList.add('hidden');
});

  generateOptions(state.currentFruit);

document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
